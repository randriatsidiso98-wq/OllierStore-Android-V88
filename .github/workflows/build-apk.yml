name: Construire OllierStore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le projet Android
        run: |
          mkdir android_project
          unzip -o OllierStore_Android_Neuf_PDF_Corrige.zip -d android_project

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compiler l'APK
        working-directory: android_project/OllierStoreAndroid
        run: gradle assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: OllierStore-APK-V88-PDF
          path: android_project/OllierStoreAndroid/app/build/outputs/apk/debug/app-debug.apk
